
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090d18">
<title>Hum Chat AI</title>

<style>
:root {
  --bg: #090d18;
  --panel: #101727;
  --panel2: #151f32;
  --border: #27334a;
  --text: #f3f6ff;
  --muted: #9ba9c2;
  --accent: #8b5cf6;
  --accent2: #06b6d4;
  --danger: #fb7185;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  height: 100dvh;
  min-height: 0;
  position: relative;
}

.sidebar {
  width: 270px;
  flex-shrink: 0;
  background: #0d1321;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 14px;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 2px 15px;
}

.brand-logo {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-size: 23px;
  background: linear-gradient(135deg, #8b5cf6, #06b6d4);
  box-shadow: 0 0 24px #8b5cf633;
}

.brand-name {
  font-size: 19px;
  font-weight: 800;
}

.brand-sub {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
}

.new-chat {
  width: 100%;
  padding: 13px;
  color: white;
  border: 1px solid #8060dc;
  border-radius: 12px;
  background: linear-gradient(110deg, #7046d8, #4f46e5);
  font-weight: 700;
  transition: .2s;
}

.new-chat:hover {
  filter: brightness(1.13);
  transform: translateY(-1px);
}

.sidebar-heading {
  font-size: 12px;
  color: var(--muted);
  padding: 8px 4px 0;
}

.conversation-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

.conversation-item {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 4px 0;
  border-radius: 10px;
  padding: 10px;
  color: #dce5f8;
  cursor: pointer;
  border: 1px solid transparent;
}

.conversation-item:hover {
  background: #172238;
}

.conversation-item.active {
  background: #1c2740;
  border-color: #384666;
}

.conversation-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
}

.small-action {
  border: 0;
  background: transparent;
  color: #a9b8d1;
  padding: 3px;
  border-radius: 5px;
}

.small-action:hover {
  background: #2a3852;
  color: white;
}

.sidebar-footer {
  border-top: 1px solid var(--border);
  padding-top: 13px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.main {
  display: flex;
  flex: 1;
  min-width: 0;
  flex-direction: column;
  position: relative;
}

.topbar {
  min-height: 63px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: #0c1220;
}

.menu-button {
  display: none;
  border: 1px solid var(--border);
  background: var(--panel);
  color: white;
  border-radius: 9px;
  padding: 8px 11px;
}

.topbar-title {
  font-weight: 700;
  font-size: 15px;
}

.status {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  color: #a7b5cc;
  font-size: 12px;
}

.status-dot {
  width: 7px;
  height: 7px;
  background: #34d399;
  border-radius: 50%;
  box-shadow: 0 0 9px #34d39988;
}

.chat-box {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px 16px 30px;
  scroll-behavior: smooth;
}

.chat-inner {
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
}

.welcome {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px 0;
}

.welcome-content {
  max-width: 600px;
  width: 100%;
}

.welcome-logo {
  font-size: 54px;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 20px #8b5cf655);
}

.welcome h1 {
  font-size: clamp(25px, 5vw, 38px);
  margin-bottom: 14px;
  letter-spacing: -.8px;
}

.gradient-text {
  background: linear-gradient(90deg, #a78bfa, #67e8f9);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.welcome p {
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
  margin-bottom: 26px;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  text-align: left;
}

.suggestion {
  background: var(--panel);
  color: #e2eaff;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 14px;
  min-height: 75px;
  transition: .2s;
}

.suggestion:hover {
  background: var(--panel2);
  border-color: #8060dc;
}

.suggestion strong {
  display: block;
  font-size: 13px;
  margin-bottom: 6px;
}

.suggestion span {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.message {
  display: flex;
  gap: 11px;
  margin: 20px 0;
  align-items: flex-start;
  animation: appear .2s ease-out;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: #1d2940;
  border: 1px solid var(--border);
}

.message.user .avatar {
  background: #4c318f;
}

.message-content {
  min-width: 0;
  flex: 1;
  padding-top: 5px;
}

.message-name {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #b7c7e3;
}

.message-text {
  color: #edf2ff;
  line-height: 1.75;
  font-size: 14px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.message-image {
  display: block;
  max-width: min(100%, 420px);
  max-height: 350px;
  object-fit: contain;
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 10px;
}

.loading-text {
  color: var(--muted);
}

.typing-dots {
  display: inline-flex;
  gap: 4px;
  margin-left: 7px;
  vertical-align: middle;
}

.typing-dots span {
  width: 5px;
  height: 5px;
  background: #a78bfa;
  border-radius: 50%;
  animation: bounce 1s infinite alternate;
}

.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }

@keyframes bounce {
  to { opacity: .3; transform: translateY(-4px); }
}

.composer-area {
  padding: 12px 16px max(12px, env(safe-area-inset-bottom));
  background: linear-gradient(transparent, #090d18 18%);
}

.composer-inner {
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
}

.image-preview {
  display: none;
  align-items: center;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 8px;
  margin-bottom: 9px;
  border-radius: 12px;
}

.image-preview.visible {
  display: flex;
}

.image-preview img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 8px;
}

.preview-info {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.remove-image {
  background: #39202c;
  color: #fda4af;
  border: 0;
  border-radius: 8px;
  padding: 8px 10px;
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  border: 1px solid #34415b;
  border-radius: 17px;
  padding: 9px;
  background: #111a2a;
  box-shadow: 0 8px 30px #0003;
}

.composer:focus-within {
  border-color: #8b5cf6;
  box-shadow: 0 0 0 2px #8b5cf622;
}

.icon-button {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 11px;
  border: 1px solid var(--border);
  color: #d8e2f7;
  background: #19243a;
  font-size: 19px;
}

.icon-button:hover {
  background: #263551;
}

#messageInput {
  flex: 1;
  min-width: 0;
  min-height: 40px;
  max-height: 150px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 10px 4px;
  line-height: 1.45;
  font-size: 14px;
}

#messageInput::placeholder {
  color: #8292ad;
}

.send-button {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 0;
  border-radius: 12px;
  color: white;
  font-size: 19px;
  font-weight: bold;
  background: linear-gradient(135deg, #8b5cf6, #4f46e5);
}

.send-button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.disclaimer {
  text-align: center;
  color: #77869f;
  font-size: 11px;
  line-height: 1.5;
  margin-top: 10px;
}

.mobile-overlay {
  display: none;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 100px;
  transform: translateX(-50%);
  max-width: calc(100% - 30px);
  background: #1d2940;
  color: white;
  border: 1px solid #3c4b68;
  padding: 11px 16px;
  border-radius: 10px;
  font-size: 13px;
  z-index: 50;
  box-shadow: 0 8px 25px #0005;
}

.hidden {
  display: none !important;
}

@media (max-width: 700px) {
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(290px, 85vw);
    transform: translateX(-105%);
    transition: transform .25s ease;
    box-shadow: 10px 0 30px #0005;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .mobile-overlay.show {
    display: block;
    position: fixed;
    inset: 0;
    background: #0009;
    z-index: 9;
  }

  .menu-button {
    display: block;
  }

  .topbar {
    padding: 10px 12px;
    min-height: 57px;
  }

  .chat-box {
    padding: 15px 13px 25px;
  }

  .composer-area {
    padding: 8px 10px max(10px, env(safe-area-inset-bottom));
  }

  .suggestions {
    grid-template-columns: 1fr;
  }

  .welcome {
    padding: 15px 0;
  }

  .welcome-logo {
    font-size: 45px;
  }

  .message {
    gap: 8px;
  }

  .avatar {
    width: 31px;
    height: 31px;
  }

  .message-text {
    font-size: 14px;
  }

  .status {
    font-size: 11px;
  }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">🤖</div>
      <div>
        <div class="brand-name">Hum Chat AI</div>
        <div class="brand-sub">Sənin süni intellekt köməkçin</div>
      </div>
    </div>

    <button class="new-chat" id="newChatBtn">＋ Yeni söhbət</button>

    <div class="sidebar-heading">SÖHBƏTLƏRİN</div>
    <div class="conversation-list" id="conversationList"></div>

    <div class="sidebar-footer">
      <strong>Hum Chat AI</strong><br>
      Sual ver, öyrən, yarat və şəkilləri təhlil et.
    </div>
  </aside>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-button" id="menuBtn" aria-label="Menyunu aç">☰</button>
      <div class="topbar-title">Hum Chat AI</div>
      <div class="status">
        <span class="status-dot"></span>
        <span>AI köməkçi</span>
      </div>
    </header>

    <section class="chat-box" id="chatBox">
      <div class="chat-inner" id="chatInner"></div>
    </section>

    <footer class="composer-area">
      <div class="composer-inner">

        <div class="image-preview" id="imagePreview">
          <img id="previewImage" alt="Seçilmiş şəkil">
          <div class="preview-info" id="previewInfo">Seçilmiş şəkil</div>
          <button class="remove-image" id="removeImageBtn" type="button">Sil ✕</button>
        </div>

        <form class="composer" id="chatForm">
          <button class="icon-button" type="button" id="imageBtn"
            aria-label="Şəkil əlavə et" title="Şəkil əlavə et">＋</button>

          <input
            type="file"
            id="imageInput"
            accept="image/jpeg,image/png,image/webp,image/gif"
            hidden
          >

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Hum AI-dan nə soruşmaq istəyirsən?"
            aria-label="Mesajın"
          ></textarea>

          <button class="send-button" id="sendBtn" type="submit"
            aria-label="Göndər">➤</button>
        </form>

        <div class="disclaimer">
          Hum Chat AI bəzən səhv cavab verə bilər. Vacib məlumatları yoxla.
        </div>
      </div>
    </footer>
  </main>
</div>

<div class="toast hidden" id="toast" role="status"></div>

<script>
"use strict";

const STORAGE_KEY = "hum_chat_ai_conversations_v1";
const MAX_IMAGE_SIZE = 8 * 1024 * 1024;

const sidebar = document.getElementById("sidebar");
const mobileOverlay = document.getElementById("mobileOverlay");
const conversationList = document.getElementById("conversationList");
const chatBox = document.getElementById("chatBox");
const chatInner = document.getElementById("chatInner");
const chatForm = document.getElementById("chatForm");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const imageInput = document.getElementById("imageInput");
const imagePreview = document.getElementById("imagePreview");
const previewImage = document.getElementById("previewImage");
const previewInfo = document.getElementById("previewInfo");
const toast = document.getElementById("toast");

let conversations = loadConversations();
let activeChatId = conversations[0]?.id || null;
let sending = false;
let selectedImage = null;
let toastTimer = null;

function makeId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 9);
}

function loadConversations() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    if (!Array.isArray(saved)) return [];

    return saved.filter(chat =>
      chat &&
      typeof chat.id === "string" &&
      Array.isArray(chat.messages)
    );
  } catch (error) {
    console.error("Söhbətlər yüklənmədi:", error);
    return [];
  }
}

function saveConversations() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  } catch (error) {
    showToast("Söhbətləri yadda saxlamaq mümkün olmadı.");
    console.error(error);
  }
}

function getActiveChat() {
  return conversations.find(chat => chat.id === activeChatId) || null;
}

function createConversation() {
  const chat = {
    id: makeId(),
    title: "Yeni söhbət",
    messages: [],
    createdAt: Date.now()
  };

  conversations.unshift(chat);
  activeChatId = chat.id;

  saveConversations();
  renderConversationList();
  renderChat();
  closeSidebar();

  messageInput.focus();
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.remove("hidden");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.add("hidden");
  }, 3000);
}

function closeSidebar() {
  sidebar.classList.remove("open");
  mobileOverlay.classList.remove("show");
}

function renderConversationList() {
  conversationList.replaceChildren();

  if (conversations.length === 0) {
    const empty = document.createElement("div");
    empty.textContent = "Hələ söhbət yoxdur.";
    empty.style.cssText =
      "padding:12px 4px;color:#8292ad;font-size:12px;";
    conversationList.appendChild(empty);
    return;
  }

  conversations.forEach(chat => {
    const item = document.createElement("div");
    item.className =
      "conversation-item" + (chat.id === activeChatId ? " active" : "");

    const title = document.createElement("div");
    title.className = "conversation-title";
    title.textContent = chat.title || "Yeni söhbət";
    title.title = title.textContent;

    title.addEventListener("click", () => {
      activeChatId = chat.id;
      renderConversationList();
      renderChat();
      closeSidebar();
    });

    const renameBtn = document.createElement("button");
    renameBtn.className = "small-action";
    renameBtn.type = "button";
    renameBtn.textContent = "✎";
    renameBtn.title = "Söhbətin adını dəyiş";
    renameBtn.setAttribute("aria-label", "Söhbətin adını dəyiş");

    renameBtn.addEventListener("click", event => {
      event.stopPropagation();

      const newTitle = prompt(
        "Söhbət üçün yeni ad yaz:",
        chat.title || "Yeni söhbət"
      );

      if (newTitle && newTitle.trim()) {
        chat.title = newTitle.trim().slice(0, 70);
        saveConversations();
        renderConversationList();
      }
    });

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "small-action";
    deleteBtn.type = "button";
    deleteBtn.textContent = "✕";
    deleteBtn.title = "Söhbəti sil";
    deleteBtn.setAttribute("aria-label", "Söhbəti sil");

    deleteBtn.addEventListener("click", event => {
      event.stopPropagation();

      if (!confirm("Bu söhbəti silmək istəyirsən?")) return;

      conversations = conversations.filter(item => item.id !== chat.id);

      if (activeChatId === chat.id) {
        activeChatId = conversations[0]?.id || null;
      }

      saveConversations();
      renderConversationList();
      renderChat();
    });

    item.append(title, renameBtn, deleteBtn);
    conversationList.appendChild(item);
  });
}

function showWelcome() {
  const welcome = document.createElement("div");
  welcome.className = "welcome";

  const content = document.createElement("div");
  content.className = "welcome-content";

  const logo = document.createElement("div");
  logo.className = "welcome-logo";
  logo.textContent = "🌌";

  const heading = document.createElement("h1");
  heading.append("Salam! ",);

  const gradient = document.createElement("span");
  gradient.className = "gradient-text";
  gradient.textContent = "Mən Hum AI-yam.";

  heading.appendChild(gradient);

  const description = document.createElement("p");
  description.textContent =
    "Gəl söhbət edək, kod yazaq, yeni şeylər öyrənək və şəkilləri təhlil edək. Bu gün sənə necə kömək edə bilərəm?";

  const suggestions = document.createElement("div");
  suggestions.className = "suggestions";

  const cards = [
    {
      icon: "💻",
      title: "Kod yazmağa kömək et",
      detail: "HTML, CSS və JavaScript haqqında sual ver.",
      prompt: "Mənə HTML, CSS və JavaScript öyrənməkdə kömək et."
    },
    {
      icon: "🖼️",
      title: "Şəkli təhlil et",
      detail: "Şəkil əlavə et və onun haqqında sual ver.",
      prompt: "Şəkil təhlili necə işləyir?"
    },
    {
      icon: "🚀",
      title: "Oyun yaratmaq",
      detail: "Öz oyunumun kodunu hazırlamaq istəyirəm.",
      prompt: "Mənə HTML, CSS və JavaScript ilə oyun yaratmağa kömək et."
    },
    {
      icon: "🧠",
      title: "Yeni bir şey öyrən",
      detail: "Mürəkkəb mövzuları sadə şəkildə öyrən.",
      prompt: "Mənə maraqlı bir texnologiya mövzusu öyrət."
    }
  ];

  cards.forEach(card => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "suggestion";

    const title = document.createElement("strong");
    title.textContent = card.icon + " " + card.title;

    const detail = document.createElement("span");
    detail.textContent = card.detail;

    button.append(title, detail);

    button.addEventListener("click", () => {
      messageInput.value = card.prompt;
      messageInput.focus();
      resizeInput();
    });

    suggestions.appendChild(button);
  });

  content.append(logo, heading, description, suggestions);
  welcome.appendChild(content);
  chatInner.appendChild(welcome);
}

function addMessageElement(message) {
  const wrapper = document.createElement("div");
  wrapper.className = "message " +
    (message.role === "user" ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = message.role === "user" ? "👤" : "🤖";

  const content = document.createElement("div");
  content.className = "message-content";

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent = message.role === "user" ? "Sən" : "Hum AI";

  content.appendChild(name);

  if (message.imageDataURL) {
    const image = document.createElement("img");
    image.className = "message-image";
    image.src = message.imageDataURL;
    image.alt = "Göndərilmiş şəkil";
    image.loading = "lazy";
    content.appendChild(image);
  }

  if (message.text) {
    const text = document.createElement("div");
    text.className = "message-text";
    text.textContent = message.text;
    content.appendChild(text);
  }

  wrapper.append(avatar, content);
  chatInner.appendChild(wrapper);

  return wrapper;
}

function renderChat() {
  chatInner.replaceChildren();

  const chat = getActiveChat();

  if (!chat || chat.messages.length === 0) {
    showWelcome();
  } else {
    chat.messages.forEach(addMessageElement);
  }

  chatBox.scrollTop = chatBox.scrollHeight;
}

function addLoadingMessage() {
  const wrapper = document.createElement("div");
  wrapper.className = "message assistant";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "🤖";

  const content = document.createElement("div");
  content.className = "message-content";

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent = "Hum AI";

  const text = document.createElement("div");
  text.className = "message-text loading-text";
  text.textContent = "Cavab hazırlanır ";

  const dots = document.createElement("span");
  dots.className = "typing-dots";

  for (let i = 0; i < 3; i++) {
    dots.appendChild(document.createElement("span"));
  }

  text.appendChild(dots);
  content.append(name, text);
  wrapper.append(avatar, content);
  chatInner.appendChild(wrapper);

  chatBox.scrollTop = chatBox.scrollHeight;

  return wrapper;
}

function setSending(value) {
  sending = value;
  sendBtn.disabled = value;
  sendBtn.textContent = value ? "…" : "➤";
  messageInput.disabled = value;
  document.getElementById("imageBtn").disabled = value;
}

function resizeInput() {
  messageInput.style.height = "auto";
  messageInput.style.height =
    Math.min(messageInput.scrollHeight, 150) + "px";
}

messageInput.addEventListener("input", resizeInput);

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();

    if (!sending) {
      chatForm.requestSubmit();
    }
  }
});

document.getElementById("newChatBtn").addEventListener(
  "click",
  createConversation
);

document.getElementById("menuBtn").addEventListener("click", () => {
  sidebar.classList.toggle("open");
  mobileOverlay.classList.toggle("show");
});

mobileOverlay.addEventListener("click", closeSidebar);

document.getElementById("imageBtn").addEventListener("click", () => {
  imageInput.click();
});

imageInput.addEventListener("change", () => {
  const file = imageInput.files?.[0];

  if (!file) return;

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];

  if (!allowedTypes.includes(file.type)) {
    showToast("Yalnız JPEG, PNG, WEBP və GIF şəkilləri qəbul edilir.");
    imageInput.value = "";
    return;
  }

  if (file.size > MAX_IMAGE_SIZE) {
    showToast("Şəklin ölçüsü 8 MB-dan çox olmamalıdır.");
    imageInput.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    selectedImage = {
      dataURL: reader.result,
      mimeType: file.type,
      name: file.name
    };

    previewImage.src = selectedImage.dataURL;
    previewInfo.textContent = selectedImage.name;
    imagePreview.classList.add("visible");
  };

  reader.onerror = () => {
    showToast("Şəkli oxumaq mümkün olmadı.");
  };

  reader.readAsDataURL(file);
});

document.getElementById("removeImageBtn").addEventListener("click", () => {
  selectedImage = null;
  imageInput.value = "";
  previewImage.removeAttribute("src");
  imagePreview.classList.remove("visible");
});

chatForm.addEventListener("submit", async event => {
  event.preventDefault();

  if (sending) return;

  const text = messageInput.value.trim();

  if (!text && !selectedImage) {
    showToast("Əvvəlcə mesaj yaz və ya şəkil əlavə et.");
    return;
  }

  if (!activeChatId || !getActiveChat()) {
    createConversation();
  }

  const chat = getActiveChat();
  if (!chat) return;

  const chatId = chat.id;
  const image = selectedImage;
  const userMessage = {
    role: "user",
    text: text || (image ? "Bu şəkli təhlil et." : ""),
    ...(image ? { imageDataURL: image.dataURL } : {})
  };

  // Tarixçəyə yeni mesaj əlavə edilməmişdən əvvəl əvvəlki mesajları götürürük.
  const history = chat.messages.map(message => ({
    role: message.role === "assistant" ? "model" : message.role,
    text: message.text || ""
  }));

  chat.messages.push(userMessage);

  if (chat.messages.length === 1) {
    chat.title = (text || "Şəkil haqqında söhbət").slice(0, 45);
  }

  saveConversations();
  renderConversationList();
  renderChat();

  messageInput.value = "";
  resizeInput();

  selectedImage = null;
  imageInput.value = "";
  previewImage.removeAttribute("src");
  imagePreview.classList.remove("visible");

  setSending(true);
  const loadingElement = addLoadingMessage();

  try {
    const payload = {
      message: userMessage.text,
      history
    };

    if (image) {
      // Serverə data:image/...;base64, hissəsi deyil,
      // yalnız Base64 məlumatı göndərilir.
      const commaIndex = image.dataURL.indexOf(",");
      payload.image = image.dataURL.slice(commaIndex + 1);
      payload.mimeType = image.mimeType;
    }

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("Server düzgün cavab göndərmədi.");
    }

    if (!response.ok || data.success === false || !data.answer) {
      throw new Error(
        data.error || "Cavab almaq mümkün olmadı. Yenidən yoxla."
      );
    }

    const answer = {
      role: "assistant",
      text: String(data.answer)
    };

    // İstifadəçi cavab gələnədək başqa söhbətə keçibsə,
    // cavabı yenə də doğru söhbətə yazırıq.
    const originalChat = conversations.find(item => item.id === chatId);

    if (originalChat) {
      originalChat.messages.push(answer);
      saveConversations();
    }

    if (activeChatId === chatId) {
      renderChat();
    }

    renderConversationList();

  } catch (error) {
    console.error("Chat xətası:", error);

    loadingElement.remove();

    const errorMessage = {
      role: "assistant",
      text: "Bağışla, cavab almaq mümkün olmadı.\n\n" +
        (error.message || "Serverlə əlaqəni yoxla.")
    };

    const originalChat = conversations.find(item => item.id === chatId);

    if (originalChat) {
      originalChat.messages.push(errorMessage);
      saveConversations();
    }

    if (activeChatId === chatId) {
      renderChat();
    }

  } finally {
    setSending(false);
    messageInput.focus();
  }
});

// Səhifə açılanda əvvəlki söhbətləri göstəririk.
if (!activeChatId || !getActiveChat()) {
  activeChatId = null;
}

renderConversationList();
renderChat();
</script>
</body>
</html>
