
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#212121">
  <title>Hüm Chat AI</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #212121;
      --panel: #171717;
      --hover: #2f2f2f;
      --border: #383838;
      --text: #f5f5f5;
      --muted: #a1a1aa;
      --accent: #10a37f;
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }

    .app { display: flex; width: 100%; height: 100%; }

    .sidebar {
      width: 255px;
      flex-shrink: 0;
      padding: 14px 12px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform .25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      font-size: 19px;
      font-weight: bold;
    }

    .logo, .welcome-logo {
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #10a37f, #3b82f6);
    }

    .logo {
      width: 35px;
      height: 35px;
      border-radius: 12px;
      font-size: 21px;
    }

    .new-chat {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: transparent;
      text-align: left;
    }

    .new-chat:hover, .side-item:hover { background: var(--hover); }

    .side-label {
      padding: 12px 9px 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .side-item {
      padding: 11px 10px;
      border-radius: 9px;
      color: #dedede;
      font-size: 14px;
    }

    .side-bottom {
      margin-top: auto;
      padding: 12px 9px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .main {
      position: relative;
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
    }

    .topbar {
      height: 62px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #303030;
    }

    .top-title { font-size: 16px; font-weight: bold; }

    .menu-button {
      display: none;
      border: 0;
      background: transparent;
      font-size: 23px;
      padding: 7px;
    }

    .status { color: #75d9b1; font-size: 12px; }

    #chat-box {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px 20px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 680px;
      margin: 13vh auto 0;
      text-align: center;
    }

    .welcome-logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      border-radius: 22px;
      font-size: 32px;
      box-shadow: 0 8px 35px #10a37f22;
    }

    .welcome h1 { margin: 0 0 12px; font-size: clamp(25px, 4vw, 34px); }

    .welcome p {
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 28px;
    }

    .suggestion {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #262626;
      text-align: left;
      line-height: 1.5;
      font-size: 13px;
    }

    .suggestion:hover { background: #303030; border-color: #626262; }

    .message-row {
      width: 100%;
      max-width: 760px;
      margin: 0 auto 25px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #343434;
      font-size: 18px;
    }

    .message-row.assistant .avatar { background: #0d725a; }

    .message-content {
      min-width: 0;
      flex: 1;
      padding-top: 7px;
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-name {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: bold;
      color: #e5e5e5;
    }

    .message-image {
      display: block;
      max-width: min(280px, 100%);
      max-height: 300px;
      margin-top: 8px;
      border-radius: 12px;
      object-fit: contain;
    }

    .typing { color: var(--muted); }

    .composer-wrap {
      flex-shrink: 0;
      padding: 12px 20px 8px;
      background: linear-gradient(transparent, var(--bg) 16%);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 760px;
      margin: 0 auto;
      padding: 10px;
      border: 1px solid #454545;
      border-radius: 19px;
      background: #303030;
      box-shadow: 0 5px 25px #00000018;
    }

    .composer:focus-within { border-color: #696969; }

    #userInput {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      resize: none;
      border: 0;
      outline: none;
      padding: 9px 5px;
      color: white;
      background: transparent;
      font-size: 16px;
      line-height: 1.5;
    }

    #userInput::placeholder { color: #a1a1aa; }

    #attachButton, #sendButton {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 13px;
    }

    #attachButton {
      background: #404040;
      color: white;
      font-size: 27px;
    }

    #attachButton:hover { background: #505050; }

    #sendButton {
      background: #f5f5f5;
      color: #171717;
      font-size: 23px;
      font-weight: bold;
    }

    #sendButton:disabled { opacity: .45; cursor: wait; }

    #fileInput { display: none; }

    .preview-wrap {
      display: none;
      max-width: 760px;
      margin: 0 auto 8px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #303030;
      align-items: center;
      gap: 10px;
    }

    .preview-wrap.visible { display: flex; }

    #imagePreview {
      width: 65px;
      height: 65px;
      border-radius: 8px;
      object-fit: cover;
    }

    .preview-info { flex: 1; min-width: 0; }

    #fileName {
      display: block;
      overflow-wrap: anywhere;
      font-size: 12px;
      color: #ddd;
    }

    #removeImage {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: #484848;
      font-size: 19px;
    }

    .disclaimer {
      max-width: 760px;
      margin: 9px auto 0;
      color: #888;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }

    .overlay { display: none; }

    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        z-index: 10;
        top: 0;
        bottom: 0;
        left: 0;
        width: 270px;
        transform: translateX(-100%);
        box-shadow: none;
      }

      .sidebar.open { transform: translateX(0); box-shadow: 12px 0 50px #0008; }

      .overlay.open {
        display: block;
        position: fixed;
        z-index: 9;
        inset: 0;
        background: #0008;
      }

      .menu-button { display: block; }

      .topbar { height: 57px; padding: 0 12px; gap: 8px; }
      #chat-box { padding: 22px 14px; }
      .welcome { margin-top: 7vh; }
      .suggestions { grid-template-columns: 1fr; gap: 8px; }
      .suggestion { padding: 12px; }
      .composer-wrap { padding: 10px 10px 7px; }
      .message-row { gap: 9px; margin-bottom: 23px; }
      .message-content { font-size: 14px; }
      .status { font-size: 11px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">✦</div>
        <span>Hüm Chat AI</span>
      </div>

      <button class="new-chat" id="newChat" type="button">
        <span>＋</span><span>Yeni söhbət</span>
      </button>

      <div class="side-label">SÖHBƏT</div>
      <div class="side-item">💬 Hüm AI ilə danış</div>

      <div class="side-bottom">
        ✦ Hüm Chat AI<br>
        Süni intellekt köməkçin
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="menu-button" id="menuButton" aria-label="Menyunu aç" type="button">☰</button>
          <div class="top-title">Hüm Chat AI <span style="color:#10a37f">⌄</span></div>
        </div>
        <div class="status">● AI hazırdır</div>
      </header>

      <section id="chat-box" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">✦</div>
          <h1>Salam! 👋</h1>
          <p>Mən Hüm Chat AI-yam.<br>Bu gün sənə necə kömək edə bilərəm?</p>

          <div class="suggestions">
            <button class="suggestion" data-prompt="Mənə JavaScript-i sadə nümunələrlə öyrət." type="button">
              💻 <strong>Proqramlaşdırma</strong><br>JavaScript öyrənməyə başla
            </button>
            <button class="suggestion" data-prompt="Mənim üçün maraqlı bir kosmik oyun ideyası düşün." type="button">
              🚀 <strong>Oyun ideyası</strong><br>Yeni kosmik oyun fikirləri
            </button>
            <button class="suggestion" data-prompt="HTML və CSS ilə gözəl bir veb səhifə hazırlamağı izah et." type="button">
              🎨 <strong>Veb dizayn</strong><br>HTML və CSS öyrən
            </button>
            <button class="suggestion" data-prompt="Bu gün öyrənə biləcəyim maraqlı bir texnologiya faktı de." type="button">
              🧠 <strong>Yeni bilik</strong><br>Maraqlı bir texnologiya faktı
            </button>
          </div>
        </div>
      </section>

      <div class="composer-wrap">
        <div class="preview-wrap" id="previewWrap">
          <img id="imagePreview" alt="Seçilmiş şəklin önizləməsi">
          <div class="preview-info">
            <span id="fileName"></span>
            <span style="color:#a1a1aa;font-size:11px">Şəkil əlavə edildi</span>
          </div>
          <button id="removeImage" type="button" aria-label="Şəkli sil">×</button>
        </div>

        <form class="composer" id="chat-form">
          <button type="button" id="attachButton" aria-label="Şəkil əlavə et" title="Şəkil əlavə et">+</button>
          <input type="file" id="fileInput" accept="image/*">

          <textarea id="userInput" rows="1"
            placeholder="Hüm AI-yə mesaj yaz..."
            aria-label="Mesajın"></textarea>

          <button type="submit" id="sendButton" aria-label="Mesajı göndər">↑</button>
        </form>

        <div class="disclaimer">
          Hüm Chat AI səhv cavab verə bilər. Vacib məlumatları yoxla.
        </div>
      </div>
    </main>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chat-box");
    const sendButton = document.getElementById("sendButton");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    const attachButton = document.getElementById("attachButton");
    const fileInput = document.getElementById("fileInput");
    const previewWrap = document.getElementById("previewWrap");
    const imagePreview = document.getElementById("imagePreview");
    const fileName = document.getElementById("fileName");
    const removeImage = document.getElementById("removeImage");

    let selectedImage = null;
    let previewUrl = null;

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function closeMenu() {
      sidebar.classList.remove("open");
      overlay.classList.remove("open");
    }

    document.getElementById("menuButton").addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("open");
    });

    overlay.addEventListener("click", closeMenu);

    attachButton.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("Zəhmət olmasa, şəkil faylı seç.");
        fileInput.value = "";
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        alert("Şəkil 10 MB-dan kiçik olmalıdır.");
        fileInput.value = "";
        return;
      }

      selectedImage = file;

      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);

      imagePreview.src = previewUrl;
      fileName.textContent = file.name;
      previewWrap.classList.add("visible");
    });

    function clearSelectedImage() {
      selectedImage = null;
      fileInput.value = "";
      previewWrap.classList.remove("visible");
      imagePreview.removeAttribute("src");

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }
    }

    removeImage.addEventListener("click", clearSelectedImage);

    function addMessage(text, role, imageUrl = null) {
      const row = document.createElement("div");
      row.className = "message-row " + role;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "👤" : "✦";

      const content = document.createElement("div");
      content.className = "message-content";

      const name = document.createElement("span");
      name.className = "message-name";
      name.textContent = role === "user" ? "Sən" : "Hüm AI";

      content.appendChild(name);

      if (text) {
        const body = document.createElement("div");
        body.textContent = text;
        content.appendChild(body);
      }

      if (imageUrl) {
        const image = document.createElement("img");
        image.className = "message-image";
        image.src = imageUrl;
        image.alt = "Göndərilən şəkil";
        content.appendChild(image);
      }

      row.appendChild(avatar);
      row.appendChild(content);
      chatBox.appendChild(row);

      scrollToBottom();
      return content.lastElementChild;
    }

    async function sendMessage(text) {
      const message = text.trim();
      const imageFile = selectedImage;

      if ((!message && !imageFile) || sendButton.disabled) return;

      document.getElementById("welcome")?.remove();

      let localImageUrl = null;
      if (imageFile) {
        localImageUrl = URL.createObjectURL(imageFile);
      }

      addMessage(message, "user", localImageUrl);

      input.value = "";
      input.style.height = "auto";
      clearSelectedImage();
      sendButton.disabled = true;
      attachButton.disabled = true;

      const reply = addMessage("Cavab hazırlanır...", "assistant");
      reply.classList.add("typing");

      try {
        let response;

        if (imageFile) {
          const body = new FormData();
          body.append("message", message || "Bu şəkli analiz et və mənə izah et.");
          body.append("image", imageFile);

          response = await fetch("/api/chat", {
            method: "POST",
            body
          });
        } else {
          response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
          });
        }

        const data = await response.json();

        if (!response.ok) {
          reply.textContent = data.error || "Xəta baş verdi.";
        } else {
          reply.textContent = data.answer || "AI cavab qaytarmadı.";
        }
      } catch (error) {
        reply.textContent = "Serverə qoşulmaq olmadı. İnterneti və serveri yoxla.";
      } finally {
        reply.classList.remove("typing");
        sendButton.disabled = false;
        attachButton.disabled = false;
        if (localImageUrl) URL.revokeObjectURL(localImageUrl);
        input.focus();
        scrollToBottom();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 150) + "px";
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll("[data-prompt]").forEach(button => {
      button.addEventListener("click", () => {
        sendMessage(button.dataset.prompt);
      });
    });

    document.getElementById("newChat").addEventListener("click", () => {
      chatBox.replaceChildren();

      const newWelcome = document.createElement("div");
      newWelcome.className = "welcome";
      newWelcome.id = "welcome";
      newWelcome.innerHTML = `
        <div class="welcome-logo">✦</div>
        <h1>Yeni söhbət ✨</h1>
        <p>Nə barədə danışmaq istəyirsən?</p>
      `;

      chatBox.appendChild(newWelcome);
      input.value = "";
      input.style.height = "auto";
      clearSelectedImage();
      closeMenu();
    });
  </script>
</body>
</html>
