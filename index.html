
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hüm Chat AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101020;
  color: white;
}

header {
  background: #21183f;
  padding: 18px;
  text-align: center;
  border-bottom: 2px solid #8050ff;
}

header h1 {
  margin: 0;
  color: #bda5ff;
}

#chat {
  height: 65vh;
  overflow-y: auto;
  padding: 15px;
}

.message {
  background: #282342;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
}

footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #17172b;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #8050ff;
  border-radius: 10px;
  background: #24243a;
  color: white;
}

button {
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #8050ff;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>🤖 Hüm Chat AI</h1>
  <p>Sənin ağıllı köməkçin</p>
</header>

<div id="chat">
  <div class="message">
    <b>Hüm Chat:</b>
    Salam! Mənimlə danışmağa hazırsan? 🚀
  </div>
</div>

<footer>
  <input id="mesaj" placeholder="Mesajını yaz...">
  <button onclick="gonder()">Göndər</button>
</footer>

<script>
function gonder() {
  const input = document.getElementById("mesaj");
  const chat = document.getElementById("chat");
  const soz = input.value.trim();

  if (soz === "") return;

  const mesaj = document.createElement("div");
  mesaj.className = "message";
  mesaj.textContent = "Sən: " + soz;

  chat.appendChild(mesaj);
  input.value = "";
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
