
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hum Chat AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #70c9ff;
      margin-top: 5px;
    }

    #chat-box {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border: 1px solid #333;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      margin: 0;
      padding: 10px 13px;
      border-radius: 10px;
      max-width: 85%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .user {
      background: #007bff;
      align-self: flex-end;
    }

    .bot {
      background: #333;
      align-self: flex-start;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #007bff;
    }

    button {
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      background: #28a745;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 12px;
    }

    @media (max-width: 400px) {
      body {
        padding: 12px;
      }

      button {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <h2>Hum Chat AI 🤖</h2>

  <div id="chat-box" aria-live="polite">
    <div class="msg bot">
      Salam! 👋 Mən Hum Chat AI-yam. Sənə necə kömək edə bilərəm?
    </div>
  </div>

  <form class="input-area" id="chat-form">
    <input
      type="text"
      id="userInput"
      placeholder="Mesajını yaz..."
      autocomplete="off"
      required
    >
    <button type="submit" id="sendButton">Göndər</button>
  </form>

  <footer>Hum Chat AI · Süni intellekt köməkçisi</footer>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chat-box");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {
      const messageElement = document.createElement("div");
      messageElement.className = "msg " + type;

      // Mətni təhlükəsiz göstəririk
      messageElement.textContent = text;

      chatBox.appendChild(messageElement);
      chatBox.scrollTop = chatBox.scrollHeight;

      return messageElement;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const message = input.value.trim();

      if (!message || sendButton.disabled) {
        return;
      }

      addMessage(message, "user");

      input.value = "";
      sendButton.disabled = true;

      const loadingMessage = addMessage(
        "AI cavab hazırlayır... ⏳",
        "bot"
      );

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        if (!response.ok) {
          loadingMessage.textContent =
            data.error || "Server xətası baş verdi.";
        } else {
          loadingMessage.textContent =
            data.answer || "AI cavab göndərmədi.";
        }

      } catch (error) {
        loadingMessage.textContent =
          "Serverə qoşulmaq olmadı. İnterneti və saytın işlədiyini yoxla.";
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    });
  </script>

</body>
</html>
